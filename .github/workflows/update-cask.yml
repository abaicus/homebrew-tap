name: Update cask

# The pull half of a belt-and-braces pair. abaicus/claude-pet's release
# workflow pushes the cask here directly, but only if a HOMEBREW_TAP_TOKEN is
# configured over there; this job needs no secret at all — the tap's own
# GITHUB_TOKEN can write to the tap. If the push half is missing or its token
# has expired, a release lands here within the hour instead of never.
#
# Both halves copy the same claude-pet.rb release asset, so they cannot
# disagree about what the cask should say.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the cask from the latest claude-pet release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo abaicus/claude-pet --json tagName -q .tagName)
          echo "latest release: ${tag}"

          if ! gh release download "$tag" --repo abaicus/claude-pet \
                 --pattern claude-pet.rb --output Casks/claude-pet.rb --clobber; then
            echo "::warning::${tag} has no claude-pet.rb asset — nothing to copy"
            exit 0
          fi

          if git diff --quiet -- Casks/claude-pet.rb; then
            echo "cask is already up to date"
            exit 0
          fi

          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/claude-pet.rb)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/claude-pet.rb
          git commit -m "claude-pet ${version}"
          git push

# Registered with GitHub Actions on first push.
