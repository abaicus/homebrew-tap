name: Update cask

# The pull half of a belt-and-braces pair. An app's release workflow may push
# its cask here directly, but only if it has a HOMEBREW_TAP_TOKEN configured;
# this job needs no secret at all — the tap's own GITHUB_TOKEN can write to the
# tap. If the push half is missing or its token has expired, a release lands
# here within the hour instead of never.
#
# Both halves copy the same <cask>.rb release asset, so they cannot disagree
# about what the cask should say.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy each cask from its app's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Each cask is named after its repo and shipped as <repo>.rb.
          for cask in gogu voice-changer; do
            tag=$(gh release view --repo "abaicus/${cask}" --json tagName -q .tagName)
            echo "${cask}: latest release ${tag}"

            if ! gh release download "$tag" --repo "abaicus/${cask}" \
                   --pattern "${cask}.rb" --output "Casks/${cask}.rb" --clobber; then
              echo "::warning::${cask} ${tag} has no ${cask}.rb asset — nothing to copy"
              continue
            fi

            # Staged first, then compared: `git diff` says nothing about a
            # cask that is still untracked here.
            git add "Casks/${cask}.rb"
            if git diff --cached --quiet; then
              echo "${cask} is already up to date"
              continue
            fi

            version=$(sed -n 's/^  version "\(.*\)"$/\1/p' "Casks/${cask}.rb")
            git commit -m "${cask} ${version}"
          done
          git push

# Registered with GitHub Actions on first push.
